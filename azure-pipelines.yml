# Azure DevOps pipeline: build the ASP.NET Core app, publish it as an
# artifact, then deploy to the Ubuntu EC2 instance. Both stages below are
# disabled (condition: false) until deploy is ready to turn on - pick one:
#
# Option A - "Deploy" stage: hosted agent copies files over ssh/scp.
#   One-time setup:
#     1. Pipelines > Library > Secure files: upload your EC2 SSH private
#        key (e.g. "CMS-deploy-key.pem") and grant this pipeline access.
#     2. Pipelines > Environments: create an environment named
#        "production" and add an approval check on it.
#     3. Update the variables below (EC2 host, SSH user, deploy path).
#
# Option B - "DeployToEnvironment" stage: EC2 box is registered as a
# Virtual Machine resource inside the "production" Environment, and the
# Azure Pipelines agent runs directly on the box (no SSH key needed).
#   One-time setup:
#     1. Pipelines > Environments > production > Add resource > Virtual
#        Machines. Give it a name (e.g. "CMS-ec2") and, optionally, a
#        tag (e.g. "CMS"). This shows a registration script + token.
#     2. SSH into the EC2 instance once by hand and run that registration
#        script - it installs the agent as a systemd service and
#        registers it against the "production" environment.
#     3. Set resourceName in that stage to match the name from step 1.
#
# Only enable one of the two stages at a time (they deploy the same box).
#
# S3 upload (Build stage): after publishing the artifact, the zip is also
# copied to an S3 bucket via the AWS Toolkit for Azure DevOps extension.
#   One-time setup:
#     1. Install "AWS Toolkit for Azure DevOps" from the Marketplace.
#     2. Project Settings > Service connections > New > AWS: create one
#        (access key/secret or role) and set its name in awsServiceConnection.
#     3. Update awsRegion below to the bucket's region.

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.x'
  # -- Update these for your environment --
  ec2Host: 'REPLACE_WITH_EC2_PUBLIC_IP_OR_DNS'
  ec2User: 'ec2-user'
  deployPath: '/var/app/current'
  sshKeySecureFile: 'CMS-deploy-key.pem'
  awsServiceConnection: 'aws-oidc-connection'
  awsRegion: 'us-east-1'
  s3BucketName: 'aar-tempbucket'
  s3KeyPrefix: 'CMS'

stages:

  - stage: Build
    displayName: 'Build and publish'
    jobs:
      - job: Build
        displayName: 'Build, test, publish artifact'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              version: $(dotnetVersion)

          - task: DotNetCoreCLI@2
            displayName: 'dotnet restore'
            inputs:
              command: 'restore'
              projects: '**/CMS.csproj'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet build'
            inputs:
              command: 'build'
              projects: '**/CMS.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # No test project yet - add one under src/CMS.Tests and this
          # step will pick it up automatically once it exists.
          - task: DotNetCoreCLI@2
            displayName: 'dotnet test'
            condition: succeededOrFailed()
            continueOnError: true
            inputs:
              command: 'test'
              projects: '**/*Tests.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet publish'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '**/CMS.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/app'
              zipAfterPublish: false
              modifyOutputPath: false
          # Inject Procfile into publish directory
          - script: |
              echo "web: dotnet CMS.dll" > $(Build.ArtifactStagingDirectory)/app/Procfile
            displayName: 'Create Beanstalk Procfile'

          #zip content of publish directoty (flat structure)
          - task: ArchiveFiles@2
            displayName: 'zip application pakage'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/app'
              includeRootFolder: false  # CRITICAL: Ensures CMS.runtimeconfig.json & Procfile are at zip root
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/CMS_deploy.zip'
              replaceExistingArchive: true
          - script: |
              unzip -l $(Build.ArtifactStagingDirectory)/CMS_deploy.zip
            displayName: 'Debug: Inspect Zip File Structure'

          - publish: $(Build.ArtifactStagingDirectory)/CMS_deploy.zip
            displayName: 'Publish build artifact'
            artifact: cms-publish

          - task: S3Upload@1
            displayName: 'Upload zip to S3'
            inputs:
              awsCredentials: '$(awsServiceConnection)'
              regionName: '$(awsRegion)'
              bucketName: '$(s3BucketName)'
              sourceFolder: '$(Build.ArtifactStagingDirectory)'
              globExpressions: 'CMS_deploy.zip'
              targetFolder: '$(s3KeyPrefix)'

