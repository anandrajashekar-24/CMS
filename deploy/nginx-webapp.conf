# Nginx reverse proxy in front of Kestrel.
#
# Install on the EC2 Ubuntu instance:
#   sudo cp nginx-webapp.conf /etc/nginx/sites-available/webapp
#   sudo ln -s /etc/nginx/sites-available/webapp /etc/nginx/sites-enabled/webapp
#   sudo rm -f /etc/nginx/sites-enabled/default   # remove the stock placeholder site
#   sudo nginx -t                                  # validate before reloading
#   sudo systemctl reload nginx
#
# Once you have a domain + TLS cert (e.g. via certbot), add a second server
# block on 443 and redirect this one (port 80) to it - see the redirect
# example commented out below.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain-or-ec2-public-dns;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Preserve the original request info for the app
        # (Program.cs is configured to trust these via ForwardedHeadersOptions).
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}

# If you later add SignalR/Blazor Server or WebSockets, add a `map` block
# for Connection upgrade headers and pass Upgrade/Connection through in the
# location block above - not needed for a plain MVC app.

